name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        typescript: [locked, latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check compatibility with the latest stable TypeScript
        if: matrix.typescript == 'latest'
        run: pnpm add --save-dev --save-exact --ignore-scripts typescript@latest
      - run: pnpm test
      - run: npm pack --dry-run
